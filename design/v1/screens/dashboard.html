            description: "kubectl forward failed — pid 8842 still listening. Kill or rebind before agent retry.",
            blockedBy: [{ id: "inf-06", label: "INF-06" }],
            blocks: [],
            activity: [
              { type: "comment", actor: "Agent", text: "bind: address already in use on 0.0.0.0:5901", time: "Today 08:55" },
              { type: "status", actor: "Agent", from: "Ready for agent", to: "In progress", time: "Today 08:54" },
            ],
          },
        ],
      },
    };

    const THREADS = {
      "invoice-pdf-parser": {
        title: "invoice-pdf-parser",
        sub: '<span class="badge badge-waiting"><span class="badge-dot"></span>Waiting</span> Codex · mac-studio-01 · 2h 14m',
        waiting: true,
        waitingPrompt: "14 rows scored below 0.85 confidence — approve corrections or skip review?",
        messages: [
          { role: "system", text: "Session started · workspace /Users/dev/invoices" },
          { role: "assistant", text: "I'll extract line items from the scanned PDFs and map them to schema v2. Starting with inv-1042.pdf." },
          { role: "system", text: "Wrote parsers/pdf_table.py · 14 rows parsed" },
          { role: "assistant", text: "Parsed 14 rows at 0.91 average confidence. Three amount fields look misaligned — I've queued them for your review before we batch the rest." },
        ],
      },
      "taskyard-ui-wireframe": {
        title: "taskyard-ui-wireframe",
        sub: '<span class="badge badge-waiting"><span class="badge-dot"></span>Waiting</span> Cursor · linux-box-02 · 38m',
        waiting: true,
        waitingPrompt: "Port 5901 is forwarded. Open VNC to review the dashboard layout, or reply to continue wireframing.",
        messages: [
          { role: "system", text: "Session started · workspace /home/dev/taskyard" },
          { role: "user", text: "Light theme, thin borders, no rounded corners. Capacity dock at the bottom, threads on the right." },
          { role: "assistant", text: "Got it — I'll bind a high-contrast token set, square badges, and move machine capacity into a bottom dock with per-machine thread buttons." },
          { role: "system", text: "Updated css/taskyard.css and screens/dashboard.html" },
          { role: "assistant", text: "Dashboard shell is in place: header with logo, center stream, right rail, bottom tiles. Thread selection syncs between the rail and machine buttons." },
          { role: "system", text: "Port 5901 was in use — cleared and re-forwarded localhost:5901 → worker:5901" },
          { role: "assistant", text: "Preview is ready on the worker. Want me to keep iterating on the chat layout, or do you want to check the live preview first?" },
        ],
      },
      "migrate-auth-to-clerk": {
        title: "migrate-auth-to-clerk",
        sub: '<span class="badge badge-completed"><span class="badge-dot"></span>Done</span> Kimi · mac-studio-01 · 6h 02m',
        waiting: false,
        messages: [
          { role: "system", text: "Session completed · 06:00:11" },
          { role: "assistant", text: "Mapped legacy session cookies to Clerk JWT middleware and added migration notes in docs/auth-migration.md." },
          { role: "system", text: "npm run build · succeeded" },
          { role: "assistant", text: "Build passed. Middleware is ready for staging — no open questions from my side." },
        ],
      },
      "fix-port-forward-leak": {
        title: "fix-port-forward-leak",
        sub: '<span class="badge badge-error"><span class="badge-dot"></span>Error</span> Codex · homelab-03 · 12m',
        waiting: false,
        messages: [
          { role: "system", text: "Session started on homelab-03" },
          { role: "assistant", text: "Running kubectl port-forward for the agent service on 5901…" },
          { role: "system", text: "Error · bind: address already in use on 0.0.0.0:5901" },
          { role: "assistant", text: "Something is still listening on 5901 (pid 8842). I can kill the stale forward if you want me to retry, or you can free the port manually." },
        ],
      },
      "openapi-client-gen": {
        title: "openapi-client-gen",
        sub: '<span class="badge badge-waiting"><span class="badge-dot"></span>Waiting</span> Cursor · linux-box-02 · 1h 05m',
        waiting: true,
        waitingPrompt: "taskyard.v1.yaml defines two auth schemes — should the client send Bearer only, or support API keys too?",
        messages: [
          { role: "system", text: "Session started · openapi/taskyard.v1.yaml" },
          { role: "assistant", text: "Generating a typed TypeScript client from the OpenAPI spec. Base types are in clients/ts/schema.d.ts." },
          { role: "system", text: "Wrote clients/ts/index.ts" },
          { role: "assistant", text: "The spec lists both Bearer JWT and x-api-key. Which auth path should the default client factory use?" },
        ],
      },
      "readme-refresh": {
        title: "readme-refresh",
        sub: '<span class="badge badge-completed"><span class="badge-dot"></span>Done</span> Kimi · homelab-03 · 22m',
        waiting: false,
        messages: [
          { role: "system", text: "Session completed · 09:10:44" },
          { role: "assistant", text: "Updated README with setup steps, env vars, and a short section on the capacity dock + thread rail layout." },
        ],
      },
    };

    const PROJECT_ORDER = ["taskyard", "invoices", "infra"];

    const chatEl = document.getElementById('chat-thread');
    const headerChat = document.getElementById('header-chat');
    const headerTask = document.getElementById('header-task');
    const taskHeaderMain = document.getElementById('task-header-main');
    const titleEl = document.getElementById('stream-title');
    const subEl = document.getElementById('stream-sub');
    const threadRail = document.querySelector('.thread-rail');
    const capacityDock = document.getElementById('capacity-dock');
    const viewChat = document.getElementById('view-chat');
    const viewTaskDetail = document.getElementById('view-task-detail');
    const tasksListEl = document.getElementById('tasks-list');
    const taskDetailEl = document.getElementById('task-detail');

    let currentThreadId = 'taskyard-ui-wireframe';
    let selectedTaskId = null;
    let centerMode = 'chat';

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderChat(id) {
      const t = THREADS[id];
      if (!t) return;
      titleEl.textContent = t.title;
      subEl.innerHTML = t.sub;

      const msgs = t.messages
        .map((m) => {
          const label =
            m.role === "user" ? "You" : m.role === "assistant" ? "Agent" : "System";
          return `<article class="chat-msg chat-msg-${m.role}">
            <header class="chat-msg-head">${label}</header>
            <div class="chat-msg-body">${escapeHtml(m.text)}</div>
          </article>`;
        })
        .join("");

      const waiting = t.waiting
        ? `<div class="chat-waiting" role="status">
            <p class="chat-waiting-label">Waiting for your input</p>
            <p class="chat-waiting-prompt">${escapeHtml(t.waitingPrompt || "")}</p>
            <div class="chat-compose">
              <input type="text" class="chat-compose-input" placeholder="Reply to agent…" aria-label="Reply to agent" />
              <button type="button" class="btn btn-primary chat-compose-send">Send</button>
            </div>
          </div>`
        : "";

      chatEl.innerHTML = `<div class="chat-scroll">${msgs}</div>${waiting}`;
    }

    function taskStatusBadge(status, label) {
      const map = {
        ready: "badge-task-ready",
        "in-progress": "badge-task-progress",
        waiting: "badge-task-waiting",
        completed: "badge-task-done",
        backlog: "badge-task-backlog",
      };
      const cls = map[status] || "badge-task-backlog";
      return `<span class="badge ${cls}"><span class="badge-dot"></span>${escapeHtml(label)}</span>`;
    }

    function showsReadyForAgentAction(task) {
      return !["ready", "in-progress", "waiting", "completed"].includes(task.status);
    }

    function readyForAgentButton(task) {
      if (!showsReadyForAgentAction(task)) return "";
      return `<button type="button" class="btn btn-primary btn-ready-agent" data-task-id="${escapeHtml(task.id)}" aria-label="Mark ${escapeHtml(task.title)} ready for agent">Ready for agent</button>`;
    }

    function taskTagsMarkup(task) {
      const tags = task.tags || [];
      if (!tags.length) return "";
      return `<div class="task-item-tags">${tags
        .map((t) => `<span class="tag-chip tag-chip-sm">${escapeHtml(t)}</span>`)
        .join("")}</div>`;
    }

    function markTaskReadyForAgent(taskId) {
      const found = findTask(taskId);
      if (!found) return;
      const { task } = found;
      if (!showsReadyForAgentAction(task)) return;
      const prev = task.statusLabel;
      task.status = "ready";
      task.statusLabel = "Ready for agent";
      task.activity = task.activity || [];
      task.activity.unshift({
        type: "status",
        actor: "Peter",
        from: prev,
        to: "Ready for agent",
        time: "Just now",
      });
      renderTasksRail();
      if (selectedTaskId === taskId && centerMode === "task") {
        renderTaskHeader(task, found.project);
        renderTaskDetail(task, found.project);
      }
    }

    function activityRole(ev) {
      if (ev.type !== "comment") return "system";
      const actor = (ev.actor || "").toLowerCase();
      if (actor === "peter" || actor === "you") return "user";
      return "assistant";
    }

    function renderActivity(events) {
      return events
        .map((ev) => {
          if (ev.type === "comment") {
            const role = activityRole(ev);
            return `<article class="chat-msg chat-msg-${role}">
              <header class="chat-msg-head">${escapeHtml(ev.actor)} · ${escapeHtml(ev.time)}</header>
              <div class="chat-msg-body">${escapeHtml(ev.text)}</div>
            </article>`;
          }
          if (ev.type === "status") {
            return `<article class="chat-msg chat-msg-system">
              <div class="chat-msg-body">${escapeHtml(ev.actor)} moved <strong>${escapeHtml(ev.from)}</strong> → <strong>${escapeHtml(ev.to)}</strong> · ${escapeHtml(ev.time)}</div>
            </article>`;
          }
          if (ev.type === "attachment") {
            return `<article class="chat-msg chat-msg-system">
              <div class="chat-msg-body">Attached <strong>${escapeHtml(ev.name)}</strong> (${escapeHtml(ev.size)}) · ${escapeHtml(ev.actor)} · ${escapeHtml(ev.time)}</div>
            </article>`;
          }
          if (ev.type === "dependency") {
            return `<article class="chat-msg chat-msg-system">
              <div class="chat-msg-body">${escapeHtml(ev.text)} · ${escapeHtml(ev.time)}</div>
            </article>`;
          }
          return "";
        })
        .join("");
    }

    function renderTaskHeader(task, project) {
      taskHeaderMain.innerHTML = `
        <div class="stream-task-title-row">
          <span class="entity-num" aria-hidden="true">${escapeHtml(task.num)}</span>
          <h2 class="stream-title stream-task-title">${escapeHtml(task.title)}</h2>
          ${readyForAgentButton(task)}
          ${taskStatusBadge(task.status, task.statusLabel)}
        </div>
        <p class="stream-sub stream-task-sub">
          <span class="task-header-project">${escapeHtml(project.name)}</span>
          · ${escapeHtml(task.assignee)}
          · opened ${escapeHtml(task.created)}
        </p>`;
    }

    function renderTaskDetail(task, project) {
      const depsBlocked =
        task.blockedBy.length > 0
          ? `<div class="task-deps-group"><span class="task-deps-label">Blocked by</span>${task.blockedBy
              .map((d) => `<button type="button" class="task-dep-chip" data-task-id="${d.id}">${escapeHtml(d.label)}</button>`)
              .join("")}</div>`
          : "";
      const depsBlocks =
        task.blocks.length > 0
          ? `<div class="task-deps-group"><span class="task-deps-label">Blocks</span>${task.blocks
              .map((d) => `<button type="button" class="task-dep-chip" data-task-id="${d.id}">${escapeHtml(d.label)}</button>`)
              .join("")}</div>`
          : "";
      const depsSection =
        depsBlocked || depsBlocks
          ? `<section class="task-deps" aria-label="Dependencies">${depsBlocked}${depsBlocks}</section>`
          : "";

      taskDetailEl.innerHTML = `
        <div class="chat-thread task-detail-feed">
          <div class="chat-scroll task-detail-scroll">
            <dl class="task-meta-grid task-meta-grid-compact" aria-label="Task metadata">
              <div><dt>Project</dt><dd>${escapeHtml(project.name)} <span class="task-meta-mono">${escapeHtml(project.repo)}</span></dd></div>
              <div><dt>Assignee</dt><dd>${escapeHtml(task.assignee)}</dd></div>
              <div><dt>Opened</dt><dd>${escapeHtml(task.created)}</dd></div>
              <div class="task-meta-tags"><dt>Tags</dt><dd>${
                (task.tags || []).length
                  ? (task.tags || [])
                      .map((t) => `<span class="tag-chip tag-chip-sm">${escapeHtml(t)}</span>`)
                      .join(" ")
                  : '<span class="task-tags-empty">No tags yet</span>'
              }</dd></div>
            </dl>
            ${depsSection}
            <article class="chat-msg chat-msg-assistant task-desc-msg">
              <header class="chat-msg-head">Description</header>
              <div class="chat-msg-body">${escapeHtml(task.description)}</div>
            </article>
            <div class="feed-messages" aria-label="Activity">${renderActivity(task.activity)}</div>
          </div>
          <footer class="task-compose-footer">
            <div class="chat-compose">
              <label class="visually-hidden" for="task-comment-input">Add comment</label>
              <input type="text" id="task-comment-input" class="chat-compose-input" placeholder="Add a comment…" />
              <button type="button" class="btn btn-primary chat-compose-send">Comment</button>
            </div>
          </footer>
        </div>`;

      taskDetailEl.querySelectorAll(".task-dep-chip").forEach((chip) => {
        chip.addEventListener("click", () => showTaskDetail(chip.dataset.taskId));
      });
    }

    function findTask(taskId) {
      for (const key of PROJECT_ORDER) {
        const project = PROJECTS[key];
        const task = project?.tasks.find((t) => t.id === taskId);
        if (task) return { task, project, projectKey: key };
      }
      return null;
    }

    function isTaskBlocked(task) {
      if (!task.blockedBy?.length) return false;
      return task.blockedBy.some((dep) => {
        const found = findTask(dep.id);
        if (!found) return true;
        return found.task.status !== "completed";
      });
    }

    /** Tasks currently blocked by this parent — never duplicated at top level. */
    function getDependentTasks(parentTask) {
      const all = PROJECT_ORDER.flatMap((key) => PROJECTS[key]?.tasks || []);
      return all.filter(
        (t) =>
          t.id !== parentTask.id &&
          isTaskBlocked(t) &&
          t.blockedBy?.some((dep) => dep.id === parentTask.id)
      );
    }

    function taskHasOpenDependents(task) {
      return getDependentTasks(task).length > 0;
    }

    /** Selected task is this task or any nested dependent in its open-blocker tree. */
    function isInDependentSubtree(taskId, rootTask) {
      if (!taskId || taskId === rootTask.id) return taskId === rootTask.id;
      return getDependentTasks(rootTask).some(
        (dep) => dep.id === taskId || isInDependentSubtree(taskId, dep)
      );
    }

    /** Dependents rail when this blocker is selected or an ancestor of the selection. */
    function shouldExpandDependents(parentTask) {
      if (!getDependentTasks(parentTask).length) return false;
      if (centerMode !== "task" || !selectedTaskId) return false;
      return isInDependentSubtree(selectedTaskId, parentTask);
    }

    /** IDs in any expanded nest — excluded from the top-level list. */
    function collectShownDependentIds() {
      const ids = new Set();
      function walk(parentTask) {
        if (!shouldExpandDependents(parentTask)) return;
        getDependentTasks(parentTask).forEach((dep) => {
          ids.add(dep.id);
          walk(dep);
        });
      }
      PROJECT_ORDER.forEach((key) => {
        (PROJECTS[key]?.tasks || []).forEach((task) => walk(task));
      });
      return ids;
    }

    function taskBlocksIndicator(task) {
      if (!taskHasOpenDependents(task)) return "";
      const count = getDependentTasks(task).length;
      return `<span class="task-blocks-indicator" title="Blocks ${count} task${count > 1 ? "s" : ""}" aria-label="Blocks ${count} dependent task${count > 1 ? "s" : ""}"></span>`;
    }

    function renderTaskListItem(task, { related = false, dependent = false } = {}) {
      const selected = task.id === selectedTaskId;
      const classes = [
        "task-item",
        related ? "task-item-related" : "",
        dependent ? "task-item-dependent" : "",
      ]
        .filter(Boolean)
        .join(" ");
      return `<button type="button" class="${classes}" data-task-id="${task.id}" aria-selected="${selected}">
        <div class="task-item-row">
          <span class="entity-num" aria-hidden="true">${escapeHtml(task.num)}</span>
          <div class="task-item-main">
            <div class="task-item-title-row">
              <h3 class="task-item-title">${escapeHtml(task.title)}</h3>
            </div>
            <div class="task-item-badges">
              ${taskStatusBadge(task.status, task.statusLabel)}
            </div>
            ${taskTagsMarkup(task)}
          </div>
        </div>
        ${taskBlocksIndicator(task)}
      </button>`;
    }

    function renderTaskDependents(parentTask, depth = 1) {
      const dependents = getDependentTasks(parentTask);
      if (!dependents.length) return "";
      return `<div class="task-deps-rail" data-depth="${depth}" aria-label="Tasks blocked by ${escapeHtml(parentTask.num)}">
        ${dependents
          .map((dep) => {
            const nested = shouldExpandDependents(dep) ? renderTaskDependents(dep, depth + 1) : "";
            return `<div class="task-item-wrap task-item-wrap-nested">
              ${renderTaskListItem(dep, { dependent: true })}
              ${nested}
            </div>`;
          })
          .join("")}
      </div>`;
    }

    function renderTasksRail() {
      const activeProject = THREAD_PROJECT[currentThreadId] || "taskyard";
      const shownAsDependent = collectShownDependentIds();
      const groups = PROJECT_ORDER.filter((key) => PROJECTS[key]?.tasks?.length)
        .map((key) => {
          const project = PROJECTS[key];
          const visibleTasks = project.tasks.filter(
            (task) =>
              task.status !== "completed" &&
              !isTaskBlocked(task) &&
              !shownAsDependent.has(task.id)
          );
          if (!visibleTasks.length) return "";
          const items = visibleTasks
            .map((task) => {
              const related = key === activeProject;
              const showDeps = shouldExpandDependents(task);
              return `<div class="task-item-wrap">
                ${renderTaskListItem(task, { related })}
                ${showDeps ? renderTaskDependents(task) : ""}
              </div>`;
            })
            .join("");
          return `<section class="task-project-group" aria-label="${escapeHtml(project.name)}">
            <div class="task-project-head"><span class="entity-label">${escapeHtml(project.name)}</span></div>
            <div class="task-project-items">${items}</div>
          </section>`;
        })
        .filter(Boolean)
        .join("");
      tasksListEl.innerHTML = groups || '<p class="tasks-empty">No tasks yet.</p>';
    }

    function setCenterHeader(mode) {
      const isTask = mode === "task";
      headerChat.hidden = isTask;
      headerTask.hidden = !isTask;
      document.querySelector(".stream-header").setAttribute(
        "aria-label",
        isTask ? "Selected task" : "Selected thread"
      );
    }

    function showChat() {
      centerMode = "chat";
      selectedTaskId = null;
      setCenterHeader("chat");
      viewChat.hidden = false;
      viewTaskDetail.hidden = true;
      const t = THREADS[currentThreadId];
      if (t) {
        titleEl.textContent = t.title;
        subEl.innerHTML = t.sub;
      }
      renderTasksRail();
      renderChat(currentThreadId);
    }

    function showTaskDetail(taskId) {
      const found = findTask(taskId);
      if (!found) return;
      const { task, project } = found;
      selectedTaskId = taskId;
      centerMode = "task";
      setCenterHeader("task");
      renderTaskHeader(task, project);
      viewChat.hidden = true;
      viewTaskDetail.hidden = false;
      renderTasksRail();
      renderTaskDetail(task, project);
    }

    function selectTask(taskId) {
      if (selectedTaskId === taskId && centerMode === "task") {
        selectedTaskId = null;
        renderTasksRail();
        showChat();
        return;
      }
      showTaskDetail(taskId);
    }

    function selectThread(id) {
      if (!THREADS[id]) return;
      currentThreadId = id;
      selectedTaskId = null;
      threadRail.querySelectorAll(".thread-item").forEach((el) => {
        el.setAttribute("aria-selected", el.dataset.thread === id ? "true" : "false");
      });
      capacityDock.querySelectorAll(".machine-thread-btn").forEach((el) => {
        el.setAttribute("aria-pressed", el.dataset.thread === id ? "true" : "false");
      });
      showChat();
    }

    tasksListEl.addEventListener("click", (e) => {
      const readyBtn = e.target.closest(".btn-ready-agent");
      if (readyBtn) {
        e.preventDefault();
        e.stopPropagation();
        markTaskReadyForAgent(readyBtn.dataset.taskId);
        return;
      }
      const btn = e.target.closest(".task-item");
      if (!btn) return;
      selectTask(btn.dataset.taskId);
    });

    taskHeaderMain.addEventListener("click", (e) => {
      const readyBtn = e.target.closest(".btn-ready-agent");
      if (!readyBtn) return;
      e.preventDefault();
      markTaskReadyForAgent(readyBtn.dataset.taskId);
    });

    threadRail.addEventListener("click", (e) => {
      const btn = e.target.closest(".thread-item");
      if (!btn) return;
      selectThread(btn.dataset.thread);
    });

    capacityDock.addEventListener("click", (e) => {
      const btn = e.target.closest(".machine-thread-btn");
      if (!btn) return;
      selectThread(btn.dataset.thread);
    });

    renderTasksRail();
    selectThread("taskyard-ui-wireframe");
  </script>
</body>
